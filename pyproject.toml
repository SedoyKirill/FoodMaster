[project]
name = "ration"
version = "0.1.0"
description = "Self-hosted family meal planner: recipe RAG, store price tracking, diet planning and shopping optimization"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"

# Base runtime: everything M1 needs to boot the API, the scheduler and migrations.
# Heavy, module-specific dependencies live in the extras below so the M1 image
# stays small and builds fast.
dependencies = [
    "fastapi>=0.140,<1.0",
    "uvicorn[standard]>=0.51,<1.0",
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
    "asyncpg>=0.31,<0.32",
    "greenlet>=3.5,<4.0",           # SQLAlchemy's asyncio bridge
    "alembic>=1.18,<2.0",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.14,<3.0",
    "pgvector>=0.5,<0.6",           # Vector column type; missing from the TZ dependency list
    "apscheduler>=3.11,<4.0",       # 4.x is still not GA
    "httpx>=0.28,<0.29",
    "structlog>=26.1,<27.0",
    # python:3.12-slim ships no system zoneinfo database, so ZoneInfo("Europe/Moscow")
    # would raise and the nightly cron jobs would never be scheduled.
    "tzdata>=2025.1",
]

[project.optional-dependencies]
# M2: embeddings. Pinned to the CPU torch index below — the GPU belongs to Ollama,
# and the default CUDA wheels would add ~2.5 GB of unused nvidia-* packages.
ml = [
    "sentence-transformers>=5.6,<6.0",
    "torch>=2.6,<3.0",
]
# M5: CP-SAT purchase optimizer.
solver = [
    "ortools>=9.15,<10.0",
]
# M2/M3: HTML and catalogue parsing.
parsing = [
    "selectolax>=0.3.30,<0.4",
    "pyyaml>=6.0,<7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "pytest-cov>=7.0,<8.0",
    # httpx.ASGITransport does not run the app lifespan; this does.
    "asgi-lifespan>=2.1,<3.0",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3.0",
    "types-pyyaml>=6.0,<7.0",
]

# ---------------------------------------------------------------------------
# uv: lockfile-driven, reproducible installs
# ---------------------------------------------------------------------------
[tool.uv]
# Virtual project: uv resolves and installs dependencies but never builds `app`
# itself. This is what keeps the Docker dependency layer independent of the
# source tree — editing app/ never invalidates it. The price is one
# PYTHONPATH=/app in the image and `pythonpath = ["."]` for pytest.
package = false
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "B008",     # FastAPI's Depends() in argument defaults is the documented idiom
    # The UI language is Russian; Cyrillic in string literals is intentional and
    # these three rules fire on every user-facing message.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
# There is an alembic/ directory at the repo root, so ruff would otherwise
# classify the alembic *package* as first-party and reorder its imports.
known-third-party = ["alembic"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
# Migration scripts are generated; alembic's own env.py is framework glue.
exclude = ["^alembic/", "^web/"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "pgvector.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]  # required: `package = false`, so `app` is never installed
addopts = "-ra --strict-markers --strict-config"
# Both loop scopes must be set and must match, or a session-scoped asyncpg
# engine used from a function-scoped test raises "attached to a different loop".
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "db: requires a running PostgreSQL instance (TEST_DATABASE_URL)",
]
